[project]
name = "fridge-chef-bot"
version = "0.1.0"
description = "Telegram bot: send fridge photos, get detected ingredients (Stage 1)."
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21.0",
    "openai>=1.50.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fridge_chef"]
